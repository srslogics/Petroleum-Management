services:
  - type: web
    name: petroleum-management
    runtime: python
    plan: starter
    region: singapore
    numInstances: 1
    buildCommand: python -m pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 'app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
