<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="demo-mode" content="true">
  <meta name="theme-color" content="#123653">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tuljai Petroleum">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/owner.webmanifest">
  <meta name="brand-logo" content="/tuljai-logo.jpg">
  <title>Tuljai Petroleum</title>
  <link rel="icon" type="image/jpeg" href="/tuljai-logo.jpg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/daily-report.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/pwa.js" defer></script>

<body>
  <div class="connection-banner" id="connection-banner" role="status" hidden>Offline · Reconnect before saving changes. Keep this page open to retain your entries.</div>

  <dialog id="install-help" aria-labelledby="install-title">
    <h2 id="install-title">Install Tuljai Petroleum</h2>
    <p id="install-instructions"></p>
    <form method="dialog"><button class="primary">Done</button></form>
  </dialog>
  <div id="app"><main class="splash">Loading Tuljai Petroleum…</main></div>

</html>
